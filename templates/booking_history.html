<!doctype html>
<html lang="en">
<head>
  <title>Beauty Parlour Management System | Booking History</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-starter.css') }}">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
</head>

<body id="home">

{% include "header.html" %}

<script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

<script>
$(function () {

  $.getJSON("/api/booking-history", function (data) {
    let rows = "";

    if (data.length === 0) {
      rows = `<tr><td colspan="6" style="color:red;">No Record Found</td></tr>`;
    } else {
      data.forEach((row, index) => {

        let statusText = row.Status ? row.Status : "Waiting for confirmation";

        rows += `
          <tr>
            <td>${index + 1}</td>
            <td>${row.AptNumber}</td>
            <td>${row.AptDate}</td>
            <td>${row.AptTime}</td>
            <td>${statusText}</td>
            <td>
              <a href="/appointment/${row.AptNumber}" class="btn btn-primary">
                View
              </a>
            </td>
          </tr>
        `;
      });
    }

    $("#historyBody").html(rows);
  });

});
</script>

<!-- Breadcrumb -->
<section class="w3l-inner-banner-main">
  <div class="container text-center">
    <h3 class="header-name">Booking History</h3>
    <p class="tiltle-para">Your appointment history</p>
  </div>
</section>

<section class="w3l-contact-info-main">
  <div class="container">
    <h4 style="text-align:center;color:blue;">Appointment History</h4>

    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>#</th>
            <th>Appointment Number</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</section>

{% include "footer.html" %}

<button onclick="topFunction()" id="movetop">↑</button>

<script>
function topFunction() {
  document.documentElement.scrollTop = 0;
}
</script>

</body>
</html>
