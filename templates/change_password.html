<!doctype html>
<html lang="en">
<head>
  <title>Beauty Parlour Management System | Change Password</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-starter.css') }}">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
</head>

<body id="home">

{% include "header.html" %}

<script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

<script>
$(function () {

  // Load contact info
  $.getJSON("/api/contact-info", function (data) {
    $("#phone").text(data.MobileNumber);
    $("#email").text(data.Email);
    $("#address").text(data.PageDescription);
    $("#time").text(data.Timing);
  });

  // Form submit
  $("#changePasswordForm").submit(function (e) {
    e.preventDefault();

    let current = $("#currentpassword").val();
    let newpass = $("#newpassword").val();
    let confirm = $("#confirmpassword").val();

    if (newpass !== confirm) {
      alert("New Password and Confirm Password do not match");
      return;
    }

    $.ajax({
      url: "/api/change-password",
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify({
        currentpassword: current,
        newpassword: newpass
      }),
      success: function (res) {
        if (res.success) {
          alert("Your password successfully changed.");
          $("#changePasswordForm")[0].reset();
        } else {
          alert(res.message);
        }
      }
    });
  });
});
</script>

<!-- Breadcrumb -->
<section class="w3l-inner-banner-main">
  <div class="container text-center">
    <h3 class="header-name">Change Password</h3>
  </div>
</section>

<section class="w3l-contact-info-main">
  <div class="container d-grid contact-view">

    <!-- Contact Info -->
    <div class="cont-details">
      <p><strong>Call:</strong> <span id="phone"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
      <p><strong>Address:</strong> <span id="address"></span></p>
      <p><strong>Time:</strong> <span id="time"></span></p>
    </div>

    <!-- Change Password Form -->
    <div class="map-content-9">
      <h3>Password change!!</h3>

      <form id="changePasswordForm">
        <label>Current Password</label>
        <input type="password" id="currentpassword" class="form-control" required>

        <label>New Password</label>
        <input type="password" id="newpassword" class="form-control" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmpassword" class="form-control" required>

        <button type="submit" class="btn btn-contact">
          Save Change
        </button>
      </form>
    </div>

  </div>
</section>

{% include "footer.html" %}

</body>
</html>
