<!doctype html>
<html lang="en">
<head>
  <title>Beauty Parlour Management System | Forgot Password</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-starter.css') }}">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
</head>

<body id="home">

{% include "header.html" %}

<script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

<script>
function checkpass() {
  if ($("#newpassword").val() !== $("#confirmpassword").val()) {
    alert("New Password and Confirm Password do not match");
    return false;
  }
  return true;
}

$(function () {

  // Load contact info
  $.getJSON("/api/contact-info", function (data) {
    $("#phone").text(data.MobileNumber);
    $("#emailinfo").text(data.Email);
    $("#address").text(data.PageDescription);
    $("#time").text(data.Timing);
  });

  // Reset password
  $("#resetForm").submit(function (e) {
    e.preventDefault();
    if (!checkpass()) return;

    $.ajax({
      url: "/api/reset-password",
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify({
        email: $("#email").val(),
        contactno: $("#contactno").val(),
        newpassword: $("#newpassword").val()
      }),
      success: function (res) {
        if (res.success) {
          alert("Password successfully changed");
          $("#resetForm")[0].reset();
        } else {
          alert("Invalid details. Please try again.");
        }
      }
    });
  });

});
</script>

<!-- Breadcrumb -->
<section class="w3l-inner-banner-main">
  <div class="container text-center">
    <h3 class="header-name">Forgot Password</h3>
  </div>
</section>

<section class="w3l-contact-info-main">
  <div class="container d-grid contact-view">

    <!-- Contact Info -->
    <div class="cont-details">
      <p><strong>Call:</strong> <span id="phone"></span></p>
      <p><strong>Email:</strong> <span id="emailinfo"></span></p>
      <p><strong>Address:</strong> <span id="address"></span></p>
      <p><strong>Time:</strong> <span id="time"></span></p>
    </div>

    <!-- Reset Form -->
    <div class="map-content-9">
      <h3>Reset your password</h3>

      <form id="resetForm">
        <input type="email" id="email" class="form-control" placeholder="Enter Your Email" required>

        <input type="text" id="contactno" class="form-control" placeholder="Contact Number"
               pattern="[0-9]+" required style="margin-top:15px;">

        <input type="password" id="newpassword" class="form-control"
               placeholder="New Password" required style="margin-top:15px;">

        <input type="password" id="confirmpassword" class="form-control"
               placeholder="Confirm Password" required style="margin-top:15px;">

        <div style="margin-top:15px;">
          <a href="/login" style="color:blue;">Signin</a>
        </div>

        <button type="submit" class="btn btn-contact" style="margin-top:15px;">
          Reset
        </button>
      </form>
    </div>

  </div>
</section>

{% include "footer.html" %}

<button onclick="document.documentElement.scrollTop=0" id="movetop">↑</button>

</body>
</html>
