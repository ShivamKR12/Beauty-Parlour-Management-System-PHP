<!doctype html>
<html lang="en">
<head>
  <title>Beauty Parlour Management System | About Us</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-starter.css') }}">
  <link href="https://fonts.googleapis.com/css?family=Josefin+Slab:400,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
</head>

<body id="home">

{% include "header.html" %}

<script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

<script>
$(function () {
  $('.navbar-toggler').click(function () {
    $('body').toggleClass('noscroll');
  });

  // AJAX call to load About Us content
  $.getJSON("/api/aboutus", function (data) {
    let html = "";
    data.forEach(row => {
      html += `
        <h5><a href="#">${row.PageTitle}</a></h5>
        <p class="para mt-2">${row.PageDescription}</p>
      `;
    });
    $("#about-content").html(html);
  });
});
</script>

<!-- Breadcrumbs -->
<section class="w3l-inner-banner-main">
  <div class="about-inner about">
    <div class="container">
      <div class="main-titles-head text-center">
        <h3 class="header-name">About Us</h3>
      </div>
    </div>
  </div>
</section>

<!-- About Section -->
<section class="w3l-content-with-photo-4" id="about">
  <div class="container">
    <div class="row">
      <div class="col-xl-6">
        <img src="{{ url_for('static', filename='images/b2.jpg') }}" class="img-responsive about-me">
      </div>
      <div class="col-xl-6">
        <h3>Beauty and success starts here</h3>
        <div class="hair-two-colums">
          <h5>Waxing</h5>
          <h5>Facial</h5>
          <h5>Hair Makeup</h5>
          <h5>Massage</h5>
          <h5>Manicure</h5>
          <h5>Pedicure</h5>
          <h5>Hair Cut</h5>
          <h5>Body Spa</h5>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Dynamic About Content -->
<section class="w3l-recent-work">
  <div class="container">
    <div class="row">
      <div class="col-lg-6">
        <div id="about-content">
          <!-- AJAX-loaded content goes here -->
        </div>
      </div>
      <div class="col-lg-6">
        <img src="{{ url_for('static', filename='images/b3.jpg') }}" class="img-responsive about-me">
      </div>
    </div>
  </div>
</section>

{% include "footer.html" %}

<button onclick="topFunction()" id="movetop">
  ↑
</button>

<script>
function topFunction() {
  document.documentElement.scrollTop = 0;
}
</script>

</body>
</html>
