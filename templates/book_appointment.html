<!doctype html>
<html lang="en">
<head>
  <title>Beauty Parlour Management System | Book Appointment</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style-starter.css') }}">
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
</head>

<body id="home">

{% include "header.html" %}

<script src="{{ url_for('static', filename='js/jquery-3.3.1.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>

<script>
$(function () {

  // Load contact info
  $.getJSON("/api/contact-info", function (data) {
    $("#phone").text(data.MobileNumber);
    $("#email").text(data.Email);
    $("#address").text(data.PageDescription);
    $("#time").text(data.Timing);
  });

  // Date min = today
  let today = new Date().toISOString().split("T")[0];
  $("#adate").attr("min", today);

  // Submit appointment (AJAX)
  $("#appointmentForm").submit(function (e) {
    e.preventDefault();

    let payload = {
      adate: $("#adate").val(),
      atime: $("#atime").val(),
      message: $("#message").val()
    };

    $.ajax({
      url: "/api/book-appointment",
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify(payload),
      success: function () {
        window.location.href = "/thank-you";
      },
      error: function () {
        alert("Something went wrong. Please try again.");
      }
    });
  });
});
</script>

<!-- Breadcrumb -->
<section class="w3l-inner-banner-main">
  <div class="container text-center">
    <h3 class="header-name">Book Appointment</h3>
  </div>
</section>

<section class="w3l-contact-info-main">
  <div class="container d-grid contact-view">

    <!-- Contact Info -->
    <div class="cont-details">
      <p><strong>Call:</strong> <span id="phone"></span></p>
      <p><strong>Email:</strong> <span id="email"></span></p>
      <p><strong>Address:</strong> <span id="address"></span></p>
      <p><strong>Time:</strong> <span id="time"></span></p>
    </div>

    <!-- Booking Form -->
    <div class="map-content-9">
      <form id="appointmentForm">
        <label>Appointment Date</label>
        <input type="date" id="adate" required class="form-control">

        <label>Appointment Time</label>
        <input type="time" id="atime" required class="form-control">

        <textarea id="message" class="form-control" placeholder="Message" required></textarea>

        <button type="submit" class="btn btn-contact">
          Make an Appointment
        </button>
      </form>
    </div>

  </div>
</section>

{% include "footer.html" %}

</body>
</html>
